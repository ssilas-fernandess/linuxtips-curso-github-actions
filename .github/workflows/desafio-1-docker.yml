name: Desafio 1 - Docker

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Nome da imagem Docker para testar'
        required: true
        type: string

jobs:
  docker-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fazer pull da imagem Docker
        run: docker pull ${{ inputs.image_name }}

      - name: Verificar imagem baixada
        run: docker image ls

      - name: Docker Scout - quickview
        uses: docker/scout-action@v1
        with:
          command: quickview
          image: ${{ inputs.image_name }}

      - name: Docker Scout - CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ inputs.image_name }}
          summary: true

